name: MackNa Cloud PR3 - Project Console

on:
  push:
    branches: [main, feat/mvp-node01-observability-20261014, feat/pr2-claude-integrated-controller-20261014, feat/pr3-project-console-20261014]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod
      - name: Resolve Go modules
        run: go mod tidy
      - name: Go tests with race detector
        run: go test -race -count=1 ./...
      - name: Go vet
        run: go vet ./...
      - name: Go coverage
        run: go test -cover ./...
      - name: Bash syntax checks
        working-directory: .
        run: bash -n scripts/*.sh
      - name: Cross-compile controller and gate for ARM64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../dist
          go build -trimpath -ldflags="-s -w" -o ../dist/mackna-agent-linux-arm64 .
          go build -trimpath -ldflags="-s -w" -o ../dist/mackna-gate-linux-arm64 ./cmd/gate
          file ../dist/mackna-*-linux-arm64
      - name: Upload binaries and service scripts
        uses: actions/upload-artifact@v4
        with:
          name: mackna-pr3-node01-arm64
          path: |
            dist/*
            deploy/systemd/mackna-agent.service
            deploy/systemd/mackna-gate.service
            scripts/install-node.sh
            scripts/upgrade-agent.sh
          retention-days: 14
          if-no-files-found: error
